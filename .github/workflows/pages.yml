# The second copy of the site: https://kleiders3010.github.io/sumate/ (used when signup.jurisgames.com is down).
# Built from web/ on every push to main by tools/mirror.mjs.
name: Site copy on GitHub Pages
on:
  push:
    branches: [main]
    paths: ["web/**", "tools/mirror.mjs", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/mirror.mjs _site /sumate/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # GitHub lists a just-uploaded artifact a moment later: deploy-pages looking at once found none (twice on 2026-11-20)
      - run: sleep 15
      - id: deployment
        uses: actions/deploy-pages@v4
