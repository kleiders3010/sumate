# The second copy of the site: https://kleiders3010.github.io/sumate/ (used when signup.jurisgames.com is down).
# Built from web/ on every push to main by tools/mirror.mjs.
name: Site copy on GitHub Pages
on:
  push:
    branches: [main]
    paths: ["web/**", "tools/mirror.mjs", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node tools/mirror.mjs _site /sumate/
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      # GitHub lists a just-uploaded artifact a moment later: deploy-pages looking at once found none (twice on 2026-11-20)
      - run: sleep 15
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
