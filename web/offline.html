<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none'; script-src 'self'; img-src 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5e57">
<title>Sumate · free sign-up sheets</title>
<link rel="icon" href="/img/icon-192.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<!-- Shown by the service worker when the app opens with no connection: never the browser's error page -->
<main class="offlinePage">
  <img src="/img/icon-192.png" alt="" width="96" height="96">
  <h1>Sumate</h1>
  <p>No connection. Sumate needs the internet to show and change sheets.</p>
  <button id="retry" class="primary">Try again</button>
</main>
<script type="module" src="/offline.js"></script>
</body>
</html>
