# Sumate: the web app (static files) and its sign-up sheets (one Durable Object per sheet), one Worker.
# Free plan: SQLite-backed Durable Objects, static assets.
name = "sumate"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = false
routes = [
  { pattern = "signup.jurisgames.com", custom_domain = true },
]

[assets]
directory = "../web"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/health"]

[[durable_objects.bindings]]
name = "SHEETS"
class_name = "Sheet"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Sheet"]
