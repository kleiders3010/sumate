# Sumate: the web app (static files) and its sign-up sheets (one Durable Object per sheet), one Worker.
# Free plan: SQLite-backed Durable Objects, static assets.
name = "sumate"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = false
routes = [
  { pattern = "signup.jurisgames.com", custom_domain = true },
]

[assets]
directory = "../web"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/health"]

# The second sheet server (kinetic/server.mjs on the game host): every sheet is copied there. SYNC_KEY, the key both
# share, is a secret (wrangler secret put SYNC_KEY, from C:/AI/Secrets/sumate-sync-key).
[vars]
PEER = "https://games.jurisgames.com/sumate"

[[durable_objects.bindings]]
name = "SHEETS"
class_name = "Sheet"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Sheet"]

# per address per minute in each Cloudflare location (index.js; the game host's copy has the same): new sheets, changes
[[ratelimits]]
name = "NEWS"
namespace_id = "2103"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "WRITES"
namespace_id = "2104"
simple = { limit = 300, period = 60 }

# reads of a sheet, per address (safety round 3, S3): each one wakes a billed sheet; an open tab asks at most
# every 8 s (8 a minute), so 120 is many tabs on one home line
[[ratelimits]]
name = "READS"
namespace_id = "2105"
simple = { limit = 120, period = 60 }
